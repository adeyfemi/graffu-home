[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/club-v-country/*"
  to = "https://club-v-country.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/top-39/*"
  to = "https://top-39.netlify.app/:splat"
  status = 200
  force = true